    <script>
      // Compatibility shim for browser extensions attempting to assign window.fetch
      (function() {
        try {
          var _fetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : undefined;
          var _currentFetch = _fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore
        }
        // Suppress uncaught errors from browser extensions
        window.addEventListener('error', function(event) {
          if (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) {
            event.preventDefault();
          }
        });
      })();
    </script>
